<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | PeriodWise AI</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0f6,#f0e6ff);color:#58395e;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,470px);background:#ffffffed;padding:34px;border-radius:26px;box-shadow:0 18px 55px #88517b22}h1{margin:0 0 8px;color:#9c4f91}p{color:#806b85;line-height:1.5}.field{margin:17px 0}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #e7c8df;border-radius:12px;font-size:16px}input:focus{outline:2px solid #d98ac1}.btn{width:100%;border:0;border-radius:13px;padding:14px;color:white;font-weight:700;background:linear-gradient(100deg,#e65b91,#a76acb);cursor:pointer;margin-top:8px}.flash{padding:12px;border-radius:10px;background:#ffe8ef;margin:12px 0}.success{background:#e5f8e9}.links{text-align:center;margin-top:18px}.links a{color:#a34888;font-weight:bold}
    .register-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}

.register-logo img {
    width: 140px;
    height: 100px;
    object-fit: contain;
    display: block;
}
</style></head><body><main class="card">
    <div class="register-logo">
    <img
        src="{{ url_for('static', filename='image/logo.png') }}"
        alt="Lunavelle Logo"
    >
</div><h1>🌸 Create your account</h1><p>Start your personal cycle and wellness journey with PeriodWise AI.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST" action="{{ url_for('auth.register') }}"><div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" maxlength="100" autocomplete="name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password (minimum 8 characters)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" type="submit">Create Account ✨</button></form><div class="links">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a><br><br><a href="{{ url_for('home') }}">Back to home</a></div></main></body></html>
